<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    The Gemini API key lives in localStorage, so any script execution on this
    origin can exfiltrate it. GitHub Pages can't set response headers, so the
    policy goes in a meta tag: it pins the exact origins the app talks to, and
    blocks the exfiltration channel even if an HTML injection ever slips in.
    Keep connect-src in sync with src/lib/gemini.js and src/lib/catalog.js.
    No frame-ancestors here: browsers ignore it in a meta tag, and GitHub
    Pages can't send the header it needs.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    img-src 'self' data: https://covers.openlibrary.org https://books.google.com https://books.googleusercontent.com;
    connect-src https://generativelanguage.googleapis.com https://openlibrary.org https://www.googleapis.com;
    form-action 'none';
    base-uri 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>GreatReads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1 data-i18n="app.wordmark">Great Reads</h1>
    <p class="tagline" data-i18n="app.tagline"></p>
  </header>

  <main>
    <section id="setup-screen" class="setup-screen">
      <div class="step-card">
        <h2 data-i18n="upload.title"></h2>
        <div class="upload-instructions-row">
          <p class="hint" data-i18n="upload.instructions"></p>
          <a id="goodreads-import-link" class="mini-btn" href="https://www.goodreads.com/review/import"
             target="_blank" rel="noopener" data-i18n="upload.importLink"
             data-i18n-attr="aria-label:upload.importLinkFull"></a>
        </div>
        <label class="file-picker">
          <input type="file" id="csv-input" accept=".csv" hidden />
          <span data-i18n="upload.button"></span>
        </label>
        <p id="upload-status" class="status-line" hidden></p>
        <p id="upload-error" class="error-line" data-i18n="upload.parseError" hidden></p>
      </div>

      <div class="step-card">
        <h2 data-i18n="key.title"></h2>
        <p class="hint" data-i18n="key.instructions"></p>
        <div id="key-setup">
          <a id="get-key-link" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener"
             data-i18n="key.getKeyLink"></a>
          <details class="key-help">
            <summary data-i18n="key.help.summary"></summary>
            <ol class="key-help-steps">
              <li data-i18n="key.help.step1"></li>
              <li data-i18n="key.help.step2"></li>
              <li data-i18n="key.help.step3"></li>
              <li data-i18n="key.help.step4"></li>
            </ol>
            <p class="hint" data-i18n="key.help.freeNote"></p>
            <p class="hint" data-i18n="key.help.secretNote"></p>
          </details>
          <div class="key-row">
            <input type="password" id="api-key-input" data-i18n-attr="placeholder:key.placeholder" />
            <button id="save-key-btn" type="button" data-i18n="key.save"></button>
          </div>
        </div>
        <p id="key-saved-note" class="status-line" data-i18n="key.alreadySaved" hidden></p>
        <div id="key-saved-actions" class="key-saved-actions" hidden>
          <button id="change-key-btn" type="button" class="link-btn" data-i18n="key.change"></button>
          <button id="forget-key-btn" type="button" class="link-btn" data-i18n="key.forget"></button>
        </div>
        <p id="key-status" class="status-line" hidden></p>
        <p id="key-error" class="error-line" data-i18n="key.invalid" hidden></p>
      </div>

      <button id="generate-btn" class="primary-btn" type="button" data-i18n="generate.button" disabled></button>
      <p id="generate-error" class="error-line" hidden></p>
    </section>

    <section id="loading-screen" class="loading-screen" hidden aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <p id="loading-text" data-i18n="generate.loading"></p>
    </section>

    <section id="results-screen" class="results-screen" hidden>
      <div class="results-header">
        <h2 data-i18n="results.title"></h2>
        <div class="filter-row" role="group">
          <button class="filter-btn active" data-filter="all" data-i18n="results.filter.all"></button>
          <button class="filter-btn" data-filter="safe" data-i18n="results.filter.safe"></button>
          <button class="filter-btn" data-filter="stretch" data-i18n="results.filter.stretch"></button>
        </div>
        <button id="regenerate-btn" type="button" class="link-btn" data-i18n="generate.regenerate"></button>
      </div>
      <p id="regenerate-note" class="hint" hidden></p>
      <p id="discarded-note" class="hint" hidden></p>
      <div id="results-grid" class="results-grid"></div>
      <p id="results-empty" class="hint" data-i18n="results.empty" hidden></p>
    </section>
  </main>

  <template id="card-template">
    <article class="book-card">
      <img class="cover" alt="" hidden />
      <div class="cover-placeholder" hidden></div>
      <div class="card-body">
        <span class="badge"></span>
        <h3 class="title"></h3>
        <p class="author"></p>
        <p class="reason"></p>
        <p class="stale-note" data-i18n="results.staleReason" hidden></p>
        <div class="card-links">
          <a class="open-library-link" target="_blank" rel="noopener" data-i18n="results.openLibraryLink" hidden></a>
          <a class="goodreads-link" target="_blank" rel="noopener" data-i18n="results.goodreadsSearchLink"></a>
        </div>
        <div class="card-actions">
          <button class="mark-read-btn" data-i18n="results.markRead"></button>
          <button class="mark-not-interested-btn" data-i18n="results.markNotInterested"></button>
        </div>
      </div>
    </article>
  </template>

  <footer class="site-footer">
    <p class="privacy-note" data-i18n="privacy.note"></p>
    <details class="faq">
      <summary data-i18n="faq.title"></summary>
      <dl class="faq-list">
        <dt data-i18n="faq.q.stored"></dt>
        <dd data-i18n="faq.a.stored"></dd>
        <dt data-i18n="faq.q.discarded"></dt>
        <dd data-i18n="faq.a.discarded"></dd>
        <dt data-i18n="faq.q.cost"></dt>
        <dd data-i18n="faq.a.cost"></dd>
        <dt data-i18n="faq.q.reset"></dt>
        <dd data-i18n="faq.a.reset"></dd>
      </dl>
    </details>
    <div class="footer-actions">
      <a href="https://github.com/nicogaldamez/greatreads" target="_blank" rel="noopener" class="social-link">
        <svg class="icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        <span data-i18n="footer.sourceLink"></span>
      </a>
      <a href="https://x.com/nicogaldamez" target="_blank" rel="noopener" class="social-link">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        <span data-i18n="footer.xLink"></span>
      </a>
    </div>
    <div class="footer-danger-zone">
      <button id="clear-data-btn" type="button" class="link-btn danger-btn"
              data-i18n="privacy.clearAll"></button>
    </div>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
